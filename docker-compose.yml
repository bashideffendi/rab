services:
  postgres:
    image: postgres:16-alpine
    container_name: rabin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rabin
      POSTGRES_PASSWORD: rabin
      POSTGRES_DB: rabin
    ports:
      - "5432:5432"
    volumes:
      - rabin_pgdata:/var/lib/postgresql/data

volumes:
  rabin_pgdata:
